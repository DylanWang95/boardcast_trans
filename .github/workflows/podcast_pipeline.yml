
name: Daily Podcast Analyzer

on:
  workflow_dispatch: # 允许你随时在网页上手动点击运行测试
  schedule:
    # 🎯 第一波：A股盘前哨 (处理美国昨夜的复盘播客)
    # 每天 UTC 时间 00:00 运行 (对应北京时间早晨 08:00 / 美西 PDT 下午 17:00)
    - cron: '0 0 * * *' 
    
    # 🎯 第二波：美股盘前哨 (处理美国清晨刚发布的新闻播客)
    # 每天 UTC 时间 13:00 运行 (对应北京时间晚上 21:00 / 美西 PDT 早晨 06:00)
    - cron: '0 13 * * *'

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Podcast Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python boardcast.py
          
      - name: Commit and Push generated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          
          if git diff-index --quiet HEAD --; then
            echo "没有检测到新内容，跳过 Git 提交步骤。"
          else
            git commit -m "Auto-generate podcast report & update history"
            git push
            echo "新报告和历史记录已成功推送到仓库！"
            
            # 👇 --- 新增功能：自动发布到 GitHub Issues 推送手机 ---
            # 找到 Daily_Reports 文件夹下最新生成的那份 Markdown 文件
            LATEST_REPORT=$(ls -t Daily_Reports/*.md | head -n 1)
            # 提取文件名作为 Issue 的标题 (去掉 .md 后缀)
            REPORT_TITLE=$(basename "$LATEST_REPORT" .md)
            
            # 使用 GitHub 官方工具创建 Issue
            gh issue create --title "🔔 $REPORT_TITLE" --body-file "$LATEST_REPORT"
          fi
        # 必须提供自动生成的 GITHUB_TOKEN，赋予机器人创建 Issue 的权限
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
