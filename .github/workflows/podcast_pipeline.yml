name: Daily Podcast Analyzer

on:
  workflow_dispatch: # 允许你随时在网页上手动点击运行测试
  schedule:
    # 定时任务：每天 UTC 时间 14:00 (美西 PDT 时间早晨 7:00 / 北京时间晚上 22:00) 自动运行
    # 你可以后续根据需要修改这个 cron 时间
    - cron: '0 14 * * *' 

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Podcast Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python boardcast.py
          
      - name: Commit and Push generated files
        run: |
          # 配置 Git 机器人账户
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 将所有新生成的文件（Markdown 和 JSON 历史账本）加入 Git
          git add .
          
          # 检查是否有文件发生变化。如果没有新播客，就不会有新文件，直接跳过提交避免报错。
          if git diff-index --quiet HEAD --; then
            echo "没有检测到新内容，跳过 Git 提交步骤。"
          else
            git commit -m "Auto-generate podcast report & update history"
            git push
            echo "新报告和历史记录已成功推送到仓库！"
          fi
